[tool.poetry]
name = "wattnet-api"
version = "1.0.1"
description = "REST API for wattnet"
license = "Apache-2.0"
authors = ["Jaime Iglesias Blanco <iglesias@ifca.es>"]
readme = "README.md"
homepage = "https://wattnet.eu"
repository = "https://github.com/wattnet/wattnet-api"
documentation = "https://api.wattnet.eu/docs"
keywords = [
    "energy", "electricity", "carbon", "carbon-footprint", 
    "water", "water-footprint", "water-impact", "greenscore",
    "api", "rest", "fastapi", 
    "sustainability", "wattnet",
]
packages = [{ include = "wattnet" }]
include = [
    "config/.env.example",
    { path = "data", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.scripts]
wattnet-api = "wattnet.api.app:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "0.121.1"
uvicorn = "0.38.0"
requests = "^2.33.0"
fastapi-versioning = "0.10.0"
geopandas = "1.1.2"
pydantic = "2.12.4"
shapely = "2.1.2"
trio = "0.32.0"
pydantic-settings = "^2.12.0"
typing-extensions = "4.15.0"
wattnet-storage = "^1.1.0"
pyyaml = "^6.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0"
pytest-trio = "^0.8.0"
pytest-cov = "^7.0.0"
httpx = ">=0.23"

[tool.poetry.group.dev.dependencies]
tox = "^4.16.0"
tox-gh-actions = "^3.0"
pre-commit = "^4.0"

[tool.poetry.group.lint.dependencies]
flake8 = ">=4,<8"
flake8-bugbear = ">=22.3,<26.0"
flake8-docstrings = "^1.6"
flake8-typing-imports = "^1.12"
flake8-colors = "^0.1"
pep8-naming = ">=0.12,<0.16"
pydocstyle = "^6.1"

[tool.poetry.group.format.dependencies]
black = ">=22.3,<27.0"
isort = "^8.0"

[tool.poetry.group.security.dependencies]
bandit = "^1.9.0"

[tool.poetry.group.deps.dependencies]
deptry = ">=0.23"

[tool.poetry.group.types.dependencies]
mypy = "^2.0"
types-requests = "^2.31.0"

[tool.poetry.group.release.dependencies]
twine = ">=4.0.2,<7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--tb=short"
markers = [
    "integration: requires a running API instance",
]

[tool.coverage.run]
source = ["wattnet"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.black]
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.deptry]
known_first_party = ["wattnet"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pytest", "pytest-cov", "pytest-trio",
    "tox", "tox-gh-actions",
    "pre-commit",
    "flake8", "flake8-bugbear", "flake8-docstrings", "flake8-typing-imports", "flake8-colors",
    "pep8-naming", "pydocstyle",
    "black", "isort",
    "bandit",
    "mypy",
    "twine",
    "deptry",
]

[tool.isort]
profile = "black"
known_first_party = ["wattnet"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "wattnet.*"
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
