[tool.poetry]
name = "wattnet-api"
version = "1.0.0"
description = "REST API for wattnet"
license = "Apache-2.0"
authors = ["Jaime Iglesias Blanco <iglesias@ifca.es>"]
readme = "README.md"
homepage = "https://wattnet.eu"
repository = "https://github.com/wattnet/wattnet-api"
documentation = "https://api.wattnet.eu/docs"
keywords = [
    "energy", "electricity", "carbon", "carbon-footprint", 
    "water", "water-footprint", "water-impact", "environmental-score",
    "api", "rest", "fastapi", 
    "sustainability", "wattnet",
]
packages = [{ include = "wattnet" }]
include = [
    "config/.env.example",
    { path = "data", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.scripts]
wattnet-api = "wattnet.api.app:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "0.136.3"
uvicorn = "0.38.0"
requests = "^2.33.0"
fastapi-versioning = "0.10.0"
geopandas = "1.1.2"
pydantic = "2.12.4"
shapely = "2.1.2"
trio = "0.32.0"
pydantic-settings = "^2.12.0"
typing-extensions = "4.15.0"
wattnet-storage = "^1.1.0"
pyyaml = "^6.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0"
pytest-trio = "^0.8.0"
pytest-cov = "^7.0.0"
httpx = ">=0.23"

[tool.poetry.group.dev.dependencies]
tox = "^4.16.0"
tox-gh-actions = "^3.0"
pre-commit = "^4.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.17.2"

[tool.poetry.group.security.dependencies]
bandit = "^1.9.0"

[tool.poetry.group.deps.dependencies]
deptry = ">=0.23"

[tool.poetry.group.types.dependencies]
mypy = "^2.0"
types-requests = "^2.31.0"

[tool.poetry.group.release.dependencies]
twine = ">=4.0.2,<7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--tb=short"
markers = [
    "integration: requires a running API instance",
]

[tool.coverage.run]
source = ["wattnet"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["wattnet"]
extend-exclude = ["env"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "D", "N", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["wattnet"]

[tool.deptry]
known_first_party = ["wattnet"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pytest", "pytest-cov", "pytest-trio",
    "tox", "tox-gh-actions",
    "pre-commit",
    "ruff",
    "bandit",
    "mypy",
    "twine",
    "deptry",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "wattnet.*"
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
