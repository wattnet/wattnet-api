# Builds a private snapshot of a commit for an exceptional deployment, see DOCKER_RELEASES.md.
# It is not a release: no version, no tag, no GitHub Release, no PyPI, and the image goes to a private package
# (<repository>-snapshot), tagged with the commit that was built. Run it by hand from the Actions tab.
#
# Before the first run: check that the package ghcr.io/<organization>/<repository>-snapshot is private (a package has one
# visibility for all its tags). The environments that deploy a snapshot need their own credentials with read access to it.
name: Snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build. Empty: the branch the workflow is run on"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    name: Build and push the snapshot
    runs-on: ubuntu-latest
    steps:
      # The submodule `data` (zones and geometries) goes into the wheel and into the image.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # The Dockerfile installs the wheel that is built here, as the release workflow does.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Build the wheel
        run: |
          pip install poetry==2.2.1
          poetry build --format wheel

      # The tag is the commit that was really built, whatever the ref was, and the registry wants lowercase names.
      - name: Name the image
        id: image
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-snapshot" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "Snapshot built from \`${{ steps.image.outputs.revision }}\`."
            echo
            echo '```yaml'
            echo "image: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
