[tox]
min_version = 4.3.3
isolated_build = true
envlist =
    py3{10,11,12,13,14}
    lint
    format-check
    bandit
    mypy
    deptry
    pypi
    wheel

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, lint, format-check, bandit, mypy, deptry, pypi, wheel

[base]
python = python3.14
package = wattnet.api
src_path = wattnet

[testenv]
usedevelop = true
allowlist_externals =
    poetry
    find
setenv =
    VIRTUAL_ENV={envdir}
    LC_ALL=en_US.utf-8
commands_pre =
    poetry -V
    poetry sync --no-root --with test --no-interaction
commands =
    find . -type f -name "*.pyc" -delete
    poetry run pytest tests/ -v --cov=wattnet --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14

[testenv:lint]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only lint --no-interaction
commands =
    poetry run ruff check {[base]src_path}

[testenv:format]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only lint --no-interaction
commands =
    poetry run ruff format {[base]src_path}

[testenv:format-check]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only lint --no-interaction
commands =
    poetry run ruff format --check --diff {[base]src_path}

[testenv:bandit]
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only security --no-interaction
commands =
    poetry run bandit -r {[base]src_path}

[testenv:mypy]
description = Static type checks
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --with types --no-interaction
commands =
    poetry run mypy -p {[base]package}

[testenv:integration]
description = Integration tests against the full FastAPI app (storage mocked)
basepython = {[base]python}
allowlist_externals =
    poetry
setenv =
    VIRTUAL_ENV={envdir}
    LC_ALL=en_US.utf-8
commands_pre =
    poetry sync --no-root --with test --no-interaction
commands =
    poetry run pytest tests/integration/ -v --tb=short

[testenv:deptry]
description = Check for unused, missing, or transitive dependencies
usedevelop = true
basepython = {[base]python}
deps = deptry>=0.23
commands_pre =
commands =
    deptry {[base]src_path}

[testenv:pypi]
description = Dry-run PyPI publish
skip_install = true
basepython = {[base]python}
commands_pre =
    poetry sync --no-root --only release --no-interaction
commands =
    poetry build
    poetry publish --dry-run --no-interaction

[testenv:wheel]
description = Build wheel and verify data files are bundled
skip_install = true
basepython = {[base]python}
allowlist_externals = poetry
commands_pre =
    poetry build --output {envtmpdir}/dist
commands =
    python scripts/check_wheel.py {envtmpdir}/dist
